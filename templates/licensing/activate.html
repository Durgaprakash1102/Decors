{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>Software Activation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        Software Activation
                    </h4>

                </div>

                <div class="card-body">

                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-{{ message.tags }}">

                                {{ message }}

                            </div>

                        {% endfor %}

                    {% endif %}

                    <div class="mb-4">

                        <h6>Current Domain</h6>

                        <strong>

                            {{ request.get_host }}

                        </strong>

                    </div>

                    <form method="POST"

                          enctype="multipart/form-data">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button
                            class="btn btn-primary w-100">

                            Activate

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
